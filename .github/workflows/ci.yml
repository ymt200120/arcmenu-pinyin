name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, arcmenu-pinyin]
  pull_request:
  workflow_dispatch:

# 说明：GNOME runtime（headless shell）验证是人工 canary 流程的一部分
# （见 runtime/README.md 与 CANARY-REPORT.md），刻意不在公开 CI 中执行，
# 避免形成未经完整隔离证明的虚假验收信号。

jobs:
  test-node:
    name: 单元测试 (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 运行拼音/排序/注入/守卫/键位测试
        run: node tests/run-tests.mjs

  test-gjs:
    name: 单元测试 (GJS，与 GNOME Shell 同运行时)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 安装 GJS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gjs
      - name: GJS 版本
        run: gjs --version
      - name: 运行同一套测试（GJS）
        run: gjs -m tests/run-tests.mjs

  shell-checks:
    name: Shell 语法与隔离断言测试
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: bash -n 语法检查
        run: |
          for f in scripts/install.sh scripts/uninstall.sh scripts/build.sh \
                   runtime/run-isolated-check.sh runtime/lib/isolation-asserts.sh \
                   runtime/test-isolation-asserts.sh; do
            bash -n "$f"
            echo "OK  $f"
          done
      - name: 隔离断言库行为测试（纯 shell，无 GNOME）
        run: bash runtime/test-isolation-asserts.sh

  build:
    name: 构建发布包与内容审计
    runs-on: ubuntu-24.04
    needs: [test-node, test-gjs, shell-checks]
    steps:
      - uses: actions/checkout@v4
      - name: 安装 zip/unzip
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zip unzip
      - name: 构建（内置 zip 根/意外条目校验）
        run: scripts/build.sh dist
      - name: 安装包内容审计
        run: |
          ZIP=dist/arcmenu-pinyin-v1.1.0.zip
          test -f "$ZIP"
          # metadata 恰好在根
          [ "$(unzip -Z1 "$ZIP" | grep -cx 'metadata.json')" = "1" ]
          # uuid/目录边界：不得出现其他扩展或 VCS/临时内容
          if unzip -Z1 "$ZIP" | grep -E 'arcmenu@arcmenu\.com|dash-to-panel|blur-my-shell|gsconnect|kimpanel|\.git(/|$)|dist/|runtime/'; then
            echo "意外条目" >&2; exit 1
          fi
          # 运行时代码禁引扫描（写配置/文件/进程）
          rm -rf pkg && mkdir pkg && unzip -q "$ZIP" -d pkg
          ! grep -rEl "gsettings set|dconf (write|load|reset)|gnome-extensions|file_set_contents|replace_contents|Subprocess|GLib\.spawn" \
              pkg/extension.js pkg/src/
          sha256sum "$ZIP"
      - uses: actions/upload-artifact@v4
        with:
          name: arcmenu-pinyin-zip
          path: dist/*.zip
